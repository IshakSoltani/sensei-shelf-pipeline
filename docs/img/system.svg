<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="System: ceiling cameras send pictures to the bridge; the bridge sends each picture to the shelf-check model and stores the verdicts it returns; the phone app and the manager dashboard read the verdicts from the bridge.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#a3b19c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #edf1e6; }
    .h { font-size: 18px; font-weight: 650; }
    .b { font-size: 14px; fill: #c4cfbd; }
    .m { font-size: 13px; fill: #a3b19c; }
    .box { fill: #182116; stroke: #2b3828; stroke-width: 1.5; }
    .flow { fill: none; stroke: #a3b19c; stroke-width: 2; stroke-linecap: round; }
  </style>
  <rect width="1000" height="520" fill="#10170f"/>

  <rect class="box" x="30" y="80" width="190" height="130" rx="12"/>
  <text class="h" x="50" y="114">Ceiling cameras</text>
  <text class="b" x="50" y="142">14 cameras over fruit</text>
  <text class="b" x="50" y="162">and vegetables, one</text>
  <text class="b" x="50" y="182">picture each per hour</text>

  <rect class="box" x="290" y="80" width="250" height="130" rx="12"/>
  <text class="h" x="312" y="114">Bridge</text>
  <text class="b" x="312" y="142">takes the pictures and keeps</text>
  <text class="b" x="312" y="162">the verdicts in Sensei's</text>
  <text class="b" x="312" y="182">annotation format</text>
  <text class="m" x="312" y="200">staff-app/bridge · :8787</text>

  <rect class="box" x="260" y="300" width="310" height="190" rx="12"/>
  <text class="h" x="282" y="334" style="fill:#e9dca6">Shelf-check model</text>
  <text class="b" x="282" y="364">0 · code rules, $0</text>
  <text class="b" x="282" y="388">1 · fine-tuned Qwen LoRA, $0</text>
  <text class="b" x="282" y="412">2 · Claude Opus, only on ambiguity</text>
  <text class="b" x="282" y="442">then code decides: the two-customer</text>
  <text class="b" x="282" y="462">test and the right-product check</text>
  <text class="m" x="282" y="480">app/server.py · :8790</text>

  <rect class="box" x="640" y="30" width="330" height="115" rx="12"/>
  <text class="h" x="662" y="64">Phone app</text>
  <text class="b" x="662" y="92">turns empty, wrong and half shelves</text>
  <text class="b" x="662" y="112">into one restock round with a pick list</text>
  <text class="m" x="662" y="132">staff-app/mobile · Expo</text>

  <rect class="box" x="640" y="165" width="330" height="115" rx="12"/>
  <text class="h" x="662" y="199">Manager dashboard</text>
  <text class="b" x="662" y="227">the whole store at a glance; staff</text>
  <text class="b" x="662" y="247">and products ranked from the rounds</text>
  <text class="m" x="662" y="267">:8787/manager.html</text>

  <path class="flow" d="M220 145 H284" marker-end="url(#a)"/>
  <path class="flow" d="M380 210 V294" marker-end="url(#a)"/>
  <text class="m" x="320" y="258">picture</text>
  <path class="flow" d="M450 300 V216" marker-end="url(#a)"/>
  <text class="m" x="460" y="258">verdicts</text>
  <path class="flow" d="M540 145 C 590 145, 585 88, 634 88" marker-end="url(#a)"/>
  <path class="flow" d="M540 145 C 590 145, 585 222, 634 222" marker-end="url(#a)"/>
</svg>
